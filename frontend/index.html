<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <section class="hero">
      <div class="hero-inner">
        <h1>Everything you love, delivered.</h1>
        <p>Laptops, phones, appliances and more at the best prices.</p>
        <a class="btn btn-primary" href="/products.html">Shop Now</a>
      </div>
    </section>

    <section class="section" ng-controller="HomeCtrl">
      <div class="alert alert-info" ng-if="msg">{{msg}}</div>
      <h2>Shop by Category</h2>
      <div
        class="grid"
        style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr))"
      >
        <a
          class="card category-card"
          ng-repeat="c in categories"
          href="/products.html?category={{c}}"
        >
          <p class="card-name">{{c}}</p>
        </a>
      </div>

      <h2 style="margin-top: 3rem">Featured Products</h2>
      <div class="grid">
        <div
          ng-repeat="p in featured"
          ng-include="'/partials/product-card.html'"
        ></div>
      </div>
    </section>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
