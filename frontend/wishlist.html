<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <main class="page" ng-controller="WishlistCtrl">
      <h1>Wishlist</h1>
      <div class="alert alert-info" ng-if="msg" style="margin-top: 1rem">
        {{msg}}
      </div>
      <p class="empty" ng-if="items && items.length === 0">
        Your wishlist is empty.
        <a href="/products.html" style="color: var(--accent)"
          >Browse products</a
        >
      </p>

      <div class="grid">
        <div
          ng-repeat="p in items"
          ng-include="'/partials/product-card.html'"
        ></div>
      </div>
    </main>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
