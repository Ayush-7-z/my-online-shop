<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <div class="auth-wrap" ng-controller="RegisterCtrl">
      <form class="auth-card" ng-submit="submit()" novalidate>
        <h1>Create your account</h1>
        <p class="sub">It takes less than a minute.</p>
        <div class="alert alert-error" ng-if="error">{{error}}</div>
        <div class="field">
          <label>Full name</label>
          <input type="text" ng-model="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" ng-model="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Phone (optional)</label>
          <input type="tel" ng-model="phone" autocomplete="tel" />
        </div>
        <div class="field">
          <label>Password</label>
          <input
            type="password"
            ng-model="password"
            required
            autocomplete="new-password"
            placeholder="8+ characters, a letter and a number"
          />
        </div>
        <button class="btn btn-primary" type="submit">Create account</button>
        <p class="switch">
          Already have an account? <a href="/login.html">Sign in</a>
        </p>
      </form>
    </div>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
