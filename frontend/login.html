<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <div class="auth-wrap" ng-controller="LoginCtrl">
      <form class="auth-card" ng-submit="submit()" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to your ShopEase account.</p>
        <div class="alert alert-error" ng-if="error">{{error}}</div>
        <div class="field">
          <label>Email</label>
          <input type="email" ng-model="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input
            type="password"
            ng-model="password"
            required
            autocomplete="current-password"
          />
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="switch">
          New to ShopEase? <a href="/register.html">Create an account</a>
        </p>
      </form>
    </div>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
