<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <main class="page" ng-controller="ProductsCtrl">
      <h1>Products</h1>
      <div class="toolbar">
        <input type="text" placeholder="Search..." ng-model="q" />
        <select ng-model="category">
          <option value="">All Categories</option>
          <option ng-repeat="c in categories()" value="{{c}}">{{c}}</option>
        </select>
        <select ng-model="sort">
          <option value="">Sort: Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>

      <div class="alert alert-info" ng-if="msg">{{msg}}</div>

      <div class="grid">
        <div
          ng-repeat="p in list()"
          ng-include="'/partials/product-card.html'"
        ></div>
      </div>
      <p class="empty" ng-if="all && list().length === 0">
        No products match your search.
      </p>
    </main>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
