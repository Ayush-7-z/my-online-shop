<!doctype html>
<html lang="en" ng-app="shopease">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed - ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/angular.min.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <div ng-include="'/partials/header.html'"></div>

    <main class="page" ng-controller="OrderCtrl" style="max-width: 640px">
      <div class="order-card confirm-card">
        <div class="confirm-icon">✓</div>
        <h1>Order Placed!</h1>
        <p class="empty" ng-if="!order" style="padding: 1rem 0">
          Loading order...
        </p>

        <div ng-if="order" class="confirm-details">
          <p>
            <strong>Order #{{order.id}}</strong> —
            <span class="badge-status" style="background: var(--success)"
              >{{order.status}}</span
            >
          </p>
          <p style="color: var(--text-2); margin: 0.5rem 0 1rem">
            Deliver to: {{order.address}}
          </p>
          <table>
            <tr ng-repeat="it in order.items">
              <td>{{it.name}} × {{it.quantity}}</td>
              <td style="text-align: right">
                {{it.price * it.quantity | rupee}}
              </td>
            </tr>
          </table>
          <p style="text-align: right; margin-top: 0.5rem">
            <strong>Total: {{order.total_amount | rupee}}</strong>
          </p>
          <div
            style="
              display: flex;
              gap: 0.75rem;
              justify-content: center;
              margin-top: 1.5rem;
            "
          >
            <a class="btn btn-primary" href="/products.html"
              >Continue Shopping</a
            >
            <a class="btn btn-ghost" href="/orders.html">View Orders</a>
          </div>
        </div>
      </div>
    </main>

    <div ng-include="'/partials/footer.html'"></div>
  </body>
</html>
